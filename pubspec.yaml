name: la_bafouille
description: Atelier français de rédaction et de correspondance privé.
publish_to: none
version: 1.0.2+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  pdf: ^3.12.0
  printing: ^5.14.3
  archive: ^4.0.9
  file_picker: ^10.3.10
  share_plus: ^10.1.4
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/templates.json
    - assets/lexique.json
    - assets/LiberationSans-Regular.ttf
    - assets/LiberationSans-Bold.ttf
    - assets/LiberationSans-Italic.ttf
    - assets/LiberationSans-BoldItalic.ttf
